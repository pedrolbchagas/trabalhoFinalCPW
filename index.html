<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="backend/ui.js"></script>
    <title>Calculadora probabilidade genética</title>
  </head>
  <body>
    <div class="container">
      <h1>🧬 Calculadora Genética</h1>
      
      <div class="container-calculadora">
        <div class="inputs">
          
          <!-- Card do Pai -->
          <div class="card-pessoa">
            <div class="pessoa-header">
              <h2> Pai</h2>
            </div>
            <div class="caracteristicas" id="caracteristicas-pai"></div>
            
            <div class="secaoAvos">
              <h3 class="avos-title"> Avós Paternos</h3>
              <div class="avos-container">
                <div class="avo-card">
                  <h4> Avô Paterno</h4>
                  <div class="caracteristicas" id="caracteristicas-avo-paterno"></div>
                </div>
                <div class="avo-card">
                  <h4> Avó Paterna</h4>
                  <div class="caracteristicas" id="caracteristicas-ava-paterna"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Card da Mãe -->
          <div class="card-pessoa">
            <div class="pessoa-header">
              <h2> Mãe</h2>
            </div>
            <div class="caracteristicas" id="caracteristicas-mae"></div>
            
            <div class="secaoAvos">
              <h3 class="avos-title"> Avós Maternos</h3>
              <div class="avos-container">
                <div class="avo-card">
                  <h4> Avô Materno</h4>
                  <div class="caracteristicas" id="caracteristicas-avo-materno"></div>
                </div>
                <div class="avo-card">
                  <h4> Avó Materna</h4>
                  <div class="caracteristicas" id="caracteristicas-ava-materna"></div>
                </div>
              </div>
            </div>
          </div>

        </div>
        
        <button class="calculate-btn" onclick="calculaTodasAsProbabilidades()">
          🧬 Calcular Probabilidades Genéticas
        </button>
      </div>
    </div>
  </body>
</html>
